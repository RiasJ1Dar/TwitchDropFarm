# Збірка релізу на тег. Мета — прибрати з процесу людську пам'ять.
#
# 17.08 у першій публікації 1.0.4 лежав .exe, зібраний ДО трьох виправлень
# скрипта підміни: тобто в релізі був файл, який не вмів оновлюватися. Помітили
# й перезалили руками, але механізм, де таке неможливе, кращий за уважність.
#
# Два входи:
#   тег v*            — збирає й прикріплює бінарники (+ Windows manifest) до релізу;
#   запуск руками     — лише збирає й кладе артефакти в Actions, нічого не
#                       публікуючи. Так механізм можна перевірити, не займаючи
#                       версію.
#
# Матриця: Windows (.exe + автооновлення), Linux x86_64, macOS (архітектура
# раннера). Автооновлення лишається Windows-only: core/update.py орієнтований
# на .exe і cmd-підміну.
name: Реліз

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # прикріпити файли до релізу

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: TwitchDropFarm-linux-x86_64
            kind: linux
          - os: macos-latest
            asset: TwitchDropFarm-macos
            kind: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Та сама лінія, на якій збирається локально. Перевірки ганяються на
          # 3.10 (мінімум із README) навмисно — там важлива сумісність
          # синтаксису, а тут важливо, щоб бінарник вийшов таким самим.
          python-version: "3.14"
          cache: pip

      - name: Системні залежності (Linux)
        if: matrix.kind == 'linux'
        run: |
          sudo apt-get update
          # tk для CustomTkinter; індикатор трею — щоб pystray зібрався з
          # реальним бекендом, а не лише з імпортом-заглушкою.
          sudo apt-get install -y python3-tk libayatana-appindicator3-dev libgtk-3-dev

      - name: Залежності
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # ⚠️ Версія прибита навмисно. Без неї CI щоразу брав найсвіжіший
          # PyInstaller, і релізний .exe виходив зібраним іншим бутлоадером,
          # ніж той, що перевірявся локально: 20.08 CI поставив 6.22.2 проти
          # локальних 6.22.0. Після оновлення програма показувала вікно
          # «Security validation failure: failed to obtain executable path for
          # parent process» — рядок із бутлоадера onefile, який перевіряє, звідки
          # його запустили (у нас — зі скрипта підміни через cmd).
          # Оновлювати цей номер свідомо й перевіряти цикл оновлення після цього.
          pip install pyinstaller==6.22.0

      # Найдешевший захист від «забув підняти версію»: тег і VERSION у коді
      # мусять збігатися, інакше програма звітуватиме не тим числом, під яким
      # лежить, і механізм оновлення порівнюватиме не те з не тим.
      - name: Тег і версія в коді збігаються
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          code="$(python -c 'from core.config import VERSION; print(VERSION)')"
          echo "тег: $tag; у коді: $code"
          test "$tag" = "$code"

      # Через модуль, а не через pyinstaller.exe: обгортки консольних скриптів
      # містять вшитий абсолютний шлях до інтерпретатора. На CI це не болить, але
      # команда мусить бути тією самою, що в інструкції для людини.
      - name: Збірка
        run: python -m PyInstaller build.spec --noconfirm

      - name: Ім'я артефакту
        shell: bash
        run: |
          set -e
          if [ "${{ matrix.kind }}" = "windows" ]; then
            test -f dist/TwitchDropFarm.exe
          else
            src=dist/TwitchDropFarm
            test -f "$src"
            mv "$src" "dist/${{ matrix.asset }}"
            chmod +x "dist/${{ matrix.asset }}"
          fi
          ls -la dist/

      - name: Манифест оновлення (лише Windows)
        if: matrix.kind == 'windows'
        shell: pwsh
        env:
          MANIFEST_SIGNING_KEY: ${{ secrets.MANIFEST_SIGNING_KEY }}
          REQUIRE_MANIFEST_SIGNATURE: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '' }}
        run: |
          $version = python -c "from core.config import VERSION; print(VERSION)"
          # Базова адреса передається завжди — інакше інструмент кладе поруч
          # блоби за хешем, тобто ще одну копію двадцятимегабайтного .exe. Для
          # тега це справжній URL релізу; при ручному запуску там опиниться
          # назва гілки, але той манифест нікуди й не публікується.
          $base = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/"
          # Манифест лише для .exe: Linux/macOS бінарники в dist/ не чіпаємо —
          # автооновлення Windows шукає TwitchDropFarm.exe.
          New-Item -ItemType Directory -Force -Path dist/win-manifest | Out-Null
          Copy-Item dist/TwitchDropFarm.exe dist/win-manifest/
          python tools/write_manifest.py dist/win-manifest $version $base
          Copy-Item dist/win-manifest/manifest.json dist/manifest.json
          Get-Content dist/manifest.json
          if ($env:REQUIRE_MANIFEST_SIGNATURE -and -not $env:MANIFEST_SIGNING_KEY) {
            throw "немає секрету MANIFEST_SIGNING_KEY — тег без підпису не публікуємо"
          }

      - name: Перевірити бінарник (--help)
        shell: bash
        run: |
          set -e
          bin="dist/${{ matrix.asset }}"
          # --help доводить, що бутлоадер і Tcl/Tk піднялись. Обрізаний
          # бінарник (перерваний PyInstaller) падає тут.
          "$bin" --help
          echo "бінарник відповів на --help"

      - name: Артефакт (запуск руками)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}-${{ github.sha }}
          path: dist/${{ matrix.asset }}

      - name: Артефакт manifest (Windows, запуск руками)
        if: github.ref_type != 'tag' && matrix.kind == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ github.sha }}
          path: dist/manifest.json

      - name: Прикріпити Linux/macOS до релізу v1.2
        # Windows не чіпаємо — лише ці два файли, .exe/manifest не чіпаємо.
        if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          tag="v1.2"
          gh release view "$tag" >/dev/null
          gh release upload "$tag" "dist/${{ matrix.asset }}" --clobber
          # Підписи в UI: REST id, не GraphQL node id (див. історію v1.0.6.x).
          rel="$(gh api "repos/${{ github.repository }}/releases" --paginate \
            | python -c "import json,sys; tag=sys.argv[1]; data=json.load(sys.stdin); print(next(r['id'] for r in data if r['tag_name']==tag))" "$tag")"
          assets="$(gh api "repos/${{ github.repository }}/releases/$rel/assets")"
          python - <<'PY' "$assets"
          import json, os, subprocess, sys
          assets = json.loads(sys.argv[1])
          # Лише Linux/macOS — Windows assets не чіпаємо (навіть підпис).
          labels = {
              "TwitchDropFarm-linux-x86_64": "Linux x86_64 — 1.2",
              "TwitchDropFarm-macos": "macOS — 1.2",
          }
          repo = os.environ["GITHUB_REPOSITORY"]
          for asset in assets:
              label = labels.get(asset["name"])
              if not label:
                  continue
              subprocess.check_call([
                  "gh", "api", "-X", "PATCH",
                  f"repos/{repo}/releases/assets/{asset['id']}",
                  "-f", f"label={label}",
              ])
          PY
