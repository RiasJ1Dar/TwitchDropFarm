[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["env", "build", "dist", "browser_profile"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "ASYNC", "DTZ", "S", "BLE", "PYI"]

# Кожен виняток нижче — свідоме рішення, а не «лінтер заважає».
ignore = [
    # Майнер має пережити будь-яку халепу в необовʼязковій частині. Падіння Telegram,
    # трею чи одного підписника подій не сміє зупинити фарм — саме там і стоять
    # широкі except. Вузькі except у критичному шляху ми ловимо оглядом коду.
    "BLE001",  # blind-except
    "S110",    # try-except-pass — те саме, у прибиранні ресурсів
    # subprocess.Popen у async-функції: він не блокує цикл подій (на відміну від
    # .wait()), а запуск браузера саме так і має відбуватись.
    "ASYNC220",
    # __aenter__ повертає конкретний клас замість Self — типізація достатня,
    # а Self зʼявився лише в 3.11, тоді як мінімум проєкту 3.10.
    "PYI034",
    # Вкладені if лишаємо там, де вони читаються краще за злиття через and.
    "SIM102",
    # Те саме про тернарний оператор: якщо гілки довгі, if/else читніший.
    "SIM108",
    # try/except/pass у прибиранні ресурсів читається не гірше за contextlib.suppress.
    "SIM105",
    # Проєкт написаний українською. Ці правила вважають кирилицю «підозріло схожою
    # на латиницю» і дають ~250 хибних спрацювань на коментарях і рядках інтерфейсу.
    "RUF001", "RUF002", "RUF003",
    # assert використовується для звуження типів, а не як перевірка вводу.
    "S101",
    # random потрібен для nonce і вибору User-Agent, не для криптографії.
    "S311",
    # AUTH_TOKEN_URL — це URL ендпоінта, а не пароль.
    "S105",
    # Запуск браузера — з явним списком аргументів і без shell. Це і є безпечний варіант.
    "S603",
]

[tool.ruff.lint.per-file-ignores]
# Часові позначки в журналі інтерфейсу — навмисно локальний час: користувач читає
# їх очима і звіряє з власним годинником, а не з UTC.
"gui/app.py" = ["DTZ005"]
